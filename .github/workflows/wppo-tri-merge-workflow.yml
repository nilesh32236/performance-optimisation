name: Tri-Weekly Merge and Release Cycle

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip release tag creation'
        type: boolean
        default: false
      force_version:
        description: 'Force a specific version (e.g., 1.7.0)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  verify:
    name: Full Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.run-checks.outputs.status }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: 8.2
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --ignore-platform-reqs
          npm ci || npm install

      - name: Run verification suite
        id: run-checks
        run: |
          FAILED=0
          echo "::group::JS Lint"
          npm run lint:js 2>&1 || { echo "JS_LINT=failed" >> $GITHUB_ENV; FAILED=1; }
          echo "::endgroup::"
          echo "::group::PHP Lint"
          composer lint 2>&1 || { echo "PHP_LINT=failed" >> $GITHUB_ENV; FAILED=1; }
          echo "::endgroup::"
          echo "::group::JS Tests"
          npm test 2>&1 || { echo "JS_TESTS=failed" >> $GITHUB_ENV; FAILED=1; }
          echo "::endgroup::"
          echo "::group::Build"
          npm run build 2>&1 || { echo "BUILD=failed" >> $GITHUB_ENV; FAILED=1; }
          echo "::endgroup::"
          if [ "$FAILED" = "1" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"

  resolve-conflicts:
    name: Resolve Merge Conflicts
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready_prs: ${{ steps.resolve.outputs.ready_prs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: 8.2
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --ignore-platform-reqs
          npm ci || npm install

      - name: Setup OpenCode
        run: |
          .github/scripts/setup-opencode.sh
        env:
          # Pinned for reproducible runs (resolved 2026-09-08 via
          # `npm view opencode-ai version` — matches the anomalyco/opencode
          # release tag the setup script downloads).
          OPENCODE_VERSION: v1.18.29

      - name: List and process open PRs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          GH_TOKEN_VALUE="${GH_TOKEN}"
          OPENCODE_API_KEY_VALUE="${OPENCODE_API_KEY}"
          OPENAI_API_KEY_VALUE="${OPENAI_API_KEY}"
          unset GH_TOKEN OPENCODE_API_KEY OPENAI_API_KEY
          gh pr list --repo "${{ github.repository }}" --state open --json number,title,headRefName,baseRefName,mergeable,reviews,statusCheckRollup > /tmp/all-prs.json
          AUTHENTICATED_REMOTE="https://x-access-token:${GH_TOKEN_VALUE}@github.com/${{ github.repository }}.git"

          READY_PRS=""
          while read -r PR; do
            PR_NUM=$(echo "$PR" | jq -r '.number')
            PR_HEAD=$(echo "$PR" | jq -r '.headRefName')
            PR_BASE=$(echo "$PR" | jq -r '.baseRefName')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')

            echo "::group::Processing PR #${PR_NUM} (${PR_HEAD} -> ${PR_BASE})"

            CHECKS_FAILED=$(echo "$PR" | jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "ERROR" or .conclusion == "STARTUP_FAILURE" or .conclusion == "STALE")] | length')
            CHECKS_PENDING=$(echo "$PR" | jq '[.statusCheckRollup[] | select(.status != "COMPLETED")] | length')

            if [ "$CHECKS_FAILED" -gt 0 ]; then
              echo "Skipping PR #${PR_NUM}: ${CHECKS_FAILED} check(s) failed"
              echo "::endgroup::"
              continue
            fi

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "Resolving merge conflicts on PR #${PR_NUM}..."

              git fetch "${AUTHENTICATED_REMOTE}" \
                "+refs/heads/${PR_HEAD}:refs/remotes/wppo-origin/pr-${PR_NUM}/head" \
                "+refs/heads/${PR_BASE}:refs/remotes/wppo-origin/pr-${PR_NUM}/base"
              EXPECTED_HEAD="$(git rev-parse "refs/remotes/wppo-origin/pr-${PR_NUM}/head")"

              git checkout -b "${PR_HEAD}-resolve" "refs/remotes/wppo-origin/pr-${PR_NUM}/head"

              if git rebase "refs/remotes/wppo-origin/pr-${PR_NUM}/base"; then
                echo "Rebase succeeded without conflicts"
                git push "${AUTHENTICATED_REMOTE}" "${PR_HEAD}-resolve:${PR_HEAD}" --force-with-lease="refs/heads/${PR_HEAD}:${EXPECTED_HEAD}"
              else
                echo "Rebase has conflicts. Resolving with AI..."
                rm -f .git/FETCH_HEAD \
                  ".git/logs/refs/remotes/wppo-origin/pr-${PR_NUM}/head" \
                  ".git/logs/refs/remotes/wppo-origin/pr-${PR_NUM}/base"
                CONFLICT_FILES=$(git diff --name-only --diff-filter=U)

                for CFILE in $CONFLICT_FILES; do
                  CONTENT=$(cat "$CFILE")
                  NEWLINE=$'\n'
                  printf -v CONFLICT_PROMPT '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s' \
                    "Resolve the merge conflict in file ${CFILE} for the Performance Optimisation WordPress plugin." \
                    "The file has merge conflict markers. Analyze both sides and produce a clean merge." \
                    "Follow these rules:" \
                    "1. Keep both changes if they don't conflict logically" \
                    "2. If one side is a version bump or trivial, prefer the incoming change" \
                    "3. Ensure PHP/JS syntax is valid after resolution" \
                    "4. Maintain WordPress Coding Standards" \
                    "5. Keep backward compatibility" \
                    "Write the resolved file content to /tmp/resolved-${CFILE//\//_}.txt"
                  # 10m per-file cap: several files fit inside the 30m job
                  # budget; any AI failure aborts the rebase and fails hard
                  # (no warning-swallow) so a half-resolved tree never pushes.
                  if ! env -i \
                    PATH="$PATH" \
                    HOME="${HOME:-/tmp}" \
                    TMPDIR="${TMPDIR:-/tmp}" \
                    OPENCODE_API_KEY="${OPENCODE_API_KEY_VALUE}" \
                    OPENAI_API_KEY="${OPENAI_API_KEY_VALUE}" \
                    timeout 10m opencode run --auto --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" \
                    "Here is the conflicted file content:${NEWLINE}${NEWLINE}\`\`\`${NEWLINE}${CONTENT}${NEWLINE}\`\`\`${NEWLINE}${NEWLINE}${CONFLICT_PROMPT}" < /dev/null; then
                    echo "::error::OpenCode conflict resolution failed for ${CFILE} — aborting rebase"
                    git rebase --abort 2>/dev/null || true
                    exit 1
                  fi

                  RESOLVED="/tmp/resolved-${CFILE//\//_}.txt"
                  if [ ! -s "$RESOLVED" ]; then
                    echo "::error::AI resolution produced no output for ${CFILE} — aborting rebase"
                    git rebase --abort 2>/dev/null || true
                    exit 1
                  fi
                  if grep -qE '^(<{7}|={7}|>{7}|\|{7})' "$RESOLVED"; then
                    echo "::error::AI resolution still contains conflict markers in ${CFILE} — aborting rebase"
                    git rebase --abort 2>/dev/null || true
                    exit 1
                  fi
                  case "$CFILE" in
                    *.php) php -l "$RESOLVED" > /dev/null || { echo "::error::AI resolution has PHP syntax errors in ${CFILE} — aborting rebase"; git rebase --abort 2>/dev/null || true; exit 1; } ;;
                    *.js) node --check "$RESOLVED" > /dev/null 2>&1 || { echo "::error::AI resolution has JS syntax errors in ${CFILE} — aborting rebase"; git rebase --abort 2>/dev/null || true; exit 1; } ;;
                  esac
                  cp "$RESOLVED" "$CFILE"
                  git add "$CFILE"
                done

                if git rebase --continue 2>/dev/null; then
                  echo "Rebase completed after conflict resolution"
                  git push "${AUTHENTICATED_REMOTE}" "${PR_HEAD}-resolve:${PR_HEAD}" --force-with-lease="refs/heads/${PR_HEAD}:${EXPECTED_HEAD}"
                else
                  echo "::warning::Could not resolve all conflicts in PR #${PR_NUM}. Aborting rebase."
                  git rebase --abort 2>/dev/null || true
                fi
              fi

              git update-ref -d "refs/remotes/wppo-origin/pr-${PR_NUM}/head" || true
              git update-ref -d "refs/remotes/wppo-origin/pr-${PR_NUM}/base" || true
              echo "Conflicts resolved for PR #${PR_NUM}"
            fi

            TOTAL_CHECKS=$(echo "$PR" | jq '.statusCheckRollup | length')

            if [ "$CHECKS_PENDING" -eq 0 ] && [ "$CHECKS_FAILED" -eq 0 ] && [ "$TOTAL_CHECKS" -gt 0 ]; then
              READY_PRS="${READY_PRS}${PR_NUM} "
            elif [ "$TOTAL_CHECKS" -eq 0 ]; then
              echo "PR #${PR_NUM}: No CI checks (may be draft PR)"
            fi

            echo "::endgroup::"
          done < <(jq -c '.[]' /tmp/all-prs.json)

          READY_PRS="${READY_PRS% }"
          echo "ready_prs=${READY_PRS}" >> "$GITHUB_OUTPUT"

  merge-all:
    name: Merge Ready PRs
    needs: [verify, resolve-conflicts]
    if: needs.resolve-conflicts.outputs.ready_prs != ''
    outputs:
      merged_prs: ${{ steps.merge-ready.outputs.merged_prs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge all ready PRs
        id: merge-ready
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Operator/automation output passed through env, never the run body.
          REPO: ${{ github.repository }}
          READY_PRS: ${{ needs.resolve-conflicts.outputs.ready_prs }}
        run: |
          MERGE_FAILED=0
          MERGED=""
          for PR_NUM in $READY_PRS; do
            echo "Merging PR #${PR_NUM}..."
            # Re-validate the exact head and check state at merge time: the
            # resolve-conflicts job read this data up to an hour earlier, and a
            # push since then must not be merged on stale green checks.
            PR_STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json isDraft,headRefOid,statusCheckRollup 2>/dev/null || echo "")
            if [ -z "$PR_STATE" ]; then
              echo "::error::Could not read PR #${PR_NUM} state; refusing to merge"
              MERGE_FAILED=1
              continue
            fi
            IS_DRAFT=$(printf '%s' "$PR_STATE" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "::error::PR #${PR_NUM} is a draft; refusing to merge"
              MERGE_FAILED=1
              continue
            fi
            NOT_GREEN=$(printf '%s' "$PR_STATE" | jq '[.statusCheckRollup[] |
              select(
                (.__typename == "StatusContext" and (.state != "SUCCESS"))
                or (.__typename != "StatusContext" and (.status != "COMPLETED" or .conclusion != "SUCCESS"))
              )] | length')
            TOTAL=$(printf '%s' "$PR_STATE" | jq '.statusCheckRollup | length')
            if [ "$TOTAL" -eq 0 ] || [ "$NOT_GREEN" -ne 0 ]; then
              echo "::error::PR #${PR_NUM} has ${NOT_GREEN} non-success check(s) of ${TOTAL}; refusing to merge"
              MERGE_FAILED=1
              continue
            fi
            HEAD_SHA=$(printf '%s' "$PR_STATE" | jq -r '.headRefOid')
            if gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA" 2>/dev/null; then
              echo "PR #${PR_NUM} merged successfully"
              gh pr edit "$PR_NUM" --repo "$REPO" --add-label "auto-merged" 2>/dev/null || true
              MERGED="${MERGED}${PR_NUM} "
            else
              echo "::error::Failed to merge PR #${PR_NUM}"
              MERGE_FAILED=1
            fi
          done
          # Swallowing merge failures let the release job tag a version that
          # never contained the queued PRs.
          if [ "$MERGE_FAILED" -ne 0 ]; then
            echo "::error::One or more merges failed; aborting before release"
            exit 1
          fi
          echo "merged_prs=${MERGED% }" >> "$GITHUB_OUTPUT"

  release:
    name: Version & Release Tag
    # Must depend on merge-all: releasing without it waited on nothing and could
    # tag a version that did not contain the PRs the cycle had just approved.
    # merge-all is skipped when no PR is ready, and a skipped dependency would
    # otherwise skip the release too, so the gate is spelled out explicitly.
    needs: [verify, resolve-conflicts, merge-all]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.resolve-conflicts.result == 'success' &&
      (needs.merge-all.result == 'success' || needs.merge-all.result == 'skipped') &&
      github.event.inputs.skip_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor || 'performance-optimisation[bot]' }}"
          git config --global user.email "${{ github.actor || 'performance-optimisation[bot]' }}@users.noreply.github.com"

      - name: Check latest release
        id: release-check
        run: |
          .github/scripts/check-latest-release.sh "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Build release assets
        id: build-release
        if: steps.release-check.outputs.needs_release == 'true'
        env:
          # Pass the operator-supplied override through env, never the run body.
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          RELEASE_CHECK_VERSION: ${{ steps.release-check.outputs.next_version }}
          RELEASE_CHECK_CURRENT: ${{ steps.release-check.outputs.current_version }}
        run: |
          NEXT_VERSION="${FORCE_VERSION:-$RELEASE_CHECK_VERSION}"
          # The value reaches sed/package.json/git below, so validate it here.
          if ! printf '%s' "$NEXT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to release: version '${NEXT_VERSION}' is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

          CURRENT_VERSION="$RELEASE_CHECK_CURRENT"
          if [ "${CURRENT_VERSION}" != "${NEXT_VERSION}" ]; then
            echo "Updating version from ${CURRENT_VERSION} to ${NEXT_VERSION}"
            # The plugin header is " * Version:           2.4.0" (leading " * "),
            # so the substitution must be anchored to the comment form. A
            # column-zero ^Version: pattern never matches, which previously
            # left the header frozen while only WPPO_VERSION advanced and made
            # the next cycle re-tag the already published version.
            sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:)([[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/\1\2${NEXT_VERSION}/" performance-optimisation.php
            sed -i "s/define( 'WPPO_VERSION', '[^']*' );/define( 'WPPO_VERSION', '${NEXT_VERSION}' );/" performance-optimisation.php
            ESCAPED_CURRENT=$(printf '%s\n' "${CURRENT_VERSION}" | sed 's/\./\\./g')
            sed -i "s/\"version\": \"${ESCAPED_CURRENT}\"/\"version\": \"${NEXT_VERSION}\"/" package.json
            git add performance-optimisation.php package.json
            git commit -m "chore: bump version to ${NEXT_VERSION}" || true

            # Fail closed: every published version source must now agree, or
            # the release tag would not match what WordPress.org reads.
            HEADER_VERSION=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' performance-optimisation.php | head -1 | awk '{print $NF}' | tr -d '\r')
            DEFINE_VERSION=$(grep -E "define\( 'WPPO_VERSION', '[^']+' \);" performance-optimisation.php | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
            PACKAGE_VERSION=$(grep -E '"version"' package.json | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
            for LABEL in header:"${HEADER_VERSION}" define:"${DEFINE_VERSION}" package:"${PACKAGE_VERSION}"; do
              if [ "${LABEL#*:}" != "${NEXT_VERSION}" ]; then
                echo "::error::Version mismatch after bump: ${LABEL} != ${NEXT_VERSION}. Aborting release."
                exit 1
              fi
            done
          fi

          # Resolve unreleased @since placeholders to the real version before building.
          if grep -rEq '@since[[:space:]]+NEXT' includes templates; then
            find includes templates -name '*.php' -exec sed -i -E "s/@since[[:space:]]+NEXT/@since ${NEXT_VERSION}/g" {} +
            git add includes templates
            git commit -m "chore: resolve unreleased @since placeholders to ${NEXT_VERSION}" || true
          fi

          npm ci || npm install
          npm run build

          git add build/ -A 2>/dev/null || true
          git commit -m "chore: prepare release ${NEXT_VERSION}" || true

      - name: Create release tag
        if: steps.release-check.outputs.needs_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          NEXT_VERSION="${{ steps.build-release.outputs.next_version }}"
          TAG_NAME="v${NEXT_VERSION}"

          git push origin HEAD:master 2>/dev/null || {
            echo "::warning::Push to master failed. Trying force-with-lease..."
            git push origin HEAD:master --force-with-lease 2>/dev/null || {
              echo "::error::Could not push to master. Aborting release."
              exit 1
            }
          }

          # Never delete or move a published tag. Recreating v2.4.0 overwrote an
          # existing GitHub release artifact and re-deployed different content
          # to WordPress.org; an existing tag means the version calculation is
          # wrong, so stop instead of rewriting release history.
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG_NAME} already exists. Refusing to delete or re-create a published tag."
            exit 1
          fi

          git tag "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

          echo "Release tag ${TAG_NAME} created and pushed."
          echo "This will trigger the release.yml workflow to build and deploy to WordPress.org."

      - name: Create release summary
        if: always()
        run: |
          {
          echo "## Tri-Weekly Merge and Release Cycle"
          echo ""
          echo "**Status:** ${{ steps.release-check.outputs.needs_release == 'true' && 'Release created' || 'No release needed' }}"
          echo ""
          echo "| Detail | Value |"
          echo "|--------|-------|"
          echo "| Current version | ${{ steps.release-check.outputs.current_version }} |"
          echo "| Latest release | ${{ steps.release-check.outputs.latest_release_tag }} |"
          echo "| Next version | ${{ steps.build-release.outputs.next_version || steps.release-check.outputs.next_version }} |"
          echo "| Verification | ${{ needs.verify.outputs.status }} |"
          echo ""
          echo "Release tag v${{ steps.build-release.outputs.next_version || steps.release-check.outputs.next_version }} pushed."
          } >> $GITHUB_STEP_SUMMARY
