name: CI — JS & PHP

on:
  push:
    branches: ["master"]
    paths-ignore:
      - 'build/**'
      - '**.md'
      - '.distignore'
      - '.gitignore'
  pull_request:
    branches: ["master"]
    paths-ignore:
      - 'build/**'
      - '**.md'
      - '.distignore'

permissions:
  contents: read
  pull-requests: write

jobs:
  opencode-installer:
    name: CI shell regressions (installer + workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Installer shell syntax
        run: bash -n .github/scripts/setup-opencode.sh .github/scripts/tests/setup-opencode.sh
      - name: Installer regression (stubbed network)
        run: bash .github/scripts/tests/setup-opencode.sh
      - name: Workflow shell syntax
        run: bash -n .github/scripts/tests/workflow-untrusted-context.sh
      - name: Untrusted workflow context regression
        run: bash .github/scripts/tests/workflow-untrusted-context.sh

  js-build:
    name: JS Lint, Test & Build
    runs-on: ubuntu-latest
    # 15m ceiling: single npm ci + lint + test + build pass, no retries.
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: JS Lint
        run: npm run lint:js

      - name: JS Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webpack-build
          path: build/
          retention-days: 7

  js-react19:
    name: JS Tests & Build (React 19)
    runs-on: ubuntu-latest
    # 20m ceiling: extra legacy-peer-deps reinstall on top of the js-build shape.
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Force React 19 (WP 7.1 readiness)
        run: npm install --save-dev --legacy-peer-deps @wordpress/element@7.0.0 react@^19 react-dom@^19 @testing-library/react@^16 @testing-library/dom @fortawesome/fontawesome-svg-core

      - name: JS Tests (React 19)
        run: npm test

      - name: Build (React 19)
        run: npm run build

  php-syntax:
    name: PHP Syntax Check (8.2–8.5)
    runs-on: ubuntu-latest
    # 10m ceiling: parallel-lint matrix shard, fastest job in the file.
    timeout-minutes: 10
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: parallel-lint

      - name: PHP Syntax Check
        run: parallel-lint --exclude vendor .

  php-tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    # 15m ceiling: composer install (dev deps incl. Brain Monkey) + full suite.
    # Added for issue #1248: previously only the daily audit ran composer
    # test, so PRs could go green while breaking the suite on master.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --ignore-platform-reqs

      - name: PHPUnit Tests
        run: composer test

  model-authority:
    name: Muse Spark Model Authority
    runs-on: ubuntu-latest
    # 5m ceiling: a pure-node config assertion, no dependency install.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      # check-config.mjs is the only executable guard that the workflows and
      # AGENTS.md still carry vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free'
      # and that no other opencode/<model> literal has appeared. It had no
      # caller, so the explicit-model-authority guarantee existed only as prose.
      - name: Model authority check
        run: npm run model:check

      - name: Model intelligence tests
        run: npm run test:model-registry
