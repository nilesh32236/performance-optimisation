  Cache_Key_methods: 4
  Cache_methods_max: 135
  Image_Optimisation_methods_max: 165
  Critical_CSS_methods_max: 137
  largest_php_class_lines_max: 14639
  largest_react_component_lines_max: 6228
  inventory: docs/architecture/class-inventory.json
automation:
  trigger: 'label autofix-trigger on the issue, or /fix comment (fires fix-issue job in wppo-ai-review.yml)'
  note: 'No standalone issue-analysis workflow exists; design review happens on the
    issue itself, then fix-issue produces the plan + PR, then review/autofix loop.'

items:
  - id: REF-001
    title: 'Extract Cache_Key boundary from Util (transient_key/option_key/cache_salt)'
    type: architecture
    priority: high
    status: merged
    github_issue: 1496
    github_pr: 1497
    merge_commit: cb08369a
    rationale: >
      Smallest safe first extraction (3 methods + stampede key helper) with the
      widest fan-in (~23 consumers of transient_key). Establishes the
      boundary-class + Util-facade pattern every later Util split reuses, without
      touching behavior, storage I/O, or hot paths.
    scope:
      - includes/class-util.php transient_key/option_key/cache_salt/stampede_stale_key
      - new includes/class-cache-key.php behind Util:: proxies
    non_goals:
      - No storage I/O or TTL policy changes; no multisite prefix change ({blog_id}_ stays).
      - No other Util splits bundled in.
    notes:
      - 'Merged 2026-09-22. Util methods stayed 170 (4 proxies kept); lines 8746→8712.
        Real count ratchet happens when proxies are removed or logic moves (REF-002+).'
    discoveries: []

