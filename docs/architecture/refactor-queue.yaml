# Refactor queue — source of truth for the incremental architecture campaign.
# Rules: ONE active item at a time; at most ONE campaign GitHub issue open.
# Statuses: queued|planning|issue-created|analysis-running|analysis-question|
#   analysis-approved|autofix-running|pr-created|pr-review-running|
#   human-verification|changes-requested|merged|superseded|blocked|cancelled
# `planning` is non-active; multiple planning epics may be recorded, but only one executable item may advance to issue-created.
# NOTE 2026-09-23: rewritten clean after scripted edits left stale statuses
# and duplicate keys. Historical merged records were reconciled against GitHub;
# Phase 3 planning records are intentionally local until their issue is created.

